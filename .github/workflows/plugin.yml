name: Validate and package LoxBerry plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s . -p 'test_*.py'
      - run: python -m compileall -q qbox_sync.py plugin/bin scripts
      - run: bash -n plugin/preinstall.sh plugin/preroot.sh plugin/postroot.sh plugin/uninstall/uninstall.sh
      - run: node --check plugin/templates/app.js
      - run: python -m unittest discover -s plenion -p 'test_*.py'
      - run: python -m unittest discover -s plenion/server -p 'test_*.py'
      - run: sh -n plenion/server/plenion.sh
      - run: python scripts/build_reader.py
      - run: python scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: cohvera-qbox-plugin
          path: dist/*
